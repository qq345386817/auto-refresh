<body><header class="topbar"><a class="brand" href="./repeat-fr-fr.html"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9Z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9M8 5.2l8 4.6"/></svg></span>Luma Studio</a><span class="demo-note">Données de démonstration</span><select id="language" aria-label="Langue"><option value="en-US">English</option><option value="zh-Hans">简体中文</option><option value="zh-Hant">繁體中文</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="de-DE">Deutsch</option><option value="fr-FR" selected>Français</option><option value="es-ES">Español</option><option value="pt-PT">Português</option><option value="ar-SA">العربية</option></select></header>
<main><div class="page-heading"><div><h1>Commandes du studio</h1><p>Un aperçu clair des commandes à expédier.</p></div></div>
<section class="metrics" aria-label="Commandes du studio"><div><span>À expédier</span><strong id="pendingCount">—</strong><i class="metric-line amber" aria-hidden="true"></i></div><div><span>Expédiées aujourd’hui</span><strong id="shippedCount">—</strong><i class="metric-line green" aria-hidden="true"></i></div><div><span>Commandes trouvées</span><strong id="matchingCount">—</strong><i class="metric-line blue" aria-hidden="true"></i></div></section>
<section id="orders" class="orders-panel" aria-label="Commandes du studio"><div class="panel-toolbar"><div class="filters" role="group" aria-label="Statut"><button type="button" data-status="all" aria-pressed="true">Toutes</button><button type="button" data-status="pending" aria-pressed="false">À expédier<span id="pendingBadge" class="filter-count" aria-hidden="true"></span></button><button type="button" data-status="shipped" aria-pressed="false">Expédiées</button></div><div class="search-refresh"><label class="search-field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><span class="sr-only">Rechercher une commande</span><input id="orderSearch" type="search" aria-label="Rechercher une commande" placeholder="Rechercher un produit" autocomplete="off" enterkeyhint="search"></label><button id="refreshOrders" class="refresh-button" type="button" aria-label="Actualiser les commandes" title="Actualiser les commandes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 6v5h-5M4 18v-5h5"/><path d="M6.1 6.1A8 8 0 0 1 20 11M4 13a8 8 0 0 0 13.9 4.9"/></svg></button></div></div>
<div class="sync-row"><p id="syncStatus" role="status" aria-live="polite">Mis à jour à l’instant</p><button id="clearFilters" type="button" hidden>Effacer les filtres</button></div>
<div class="table-wrap"><table><thead><tr><th scope="col">Commande</th><th scope="col">Produit</th><th scope="col">Statut</th><th scope="col">Mise à jour</th></tr></thead><tbody id="orderRows"></tbody></table></div>
<footer class="table-footer"><p id="showing" role="status" aria-live="polite"></p><div><button id="loadMore" type="button">Afficher plus</button></div></footer></section></main>
