<main><div class="page-heading"><div><h1>Studio orders</h1><p>A clear view of what needs to ship.</p></div></div>

<section id="orders" class="orders-panel" aria-label="Studio orders"><div class="panel-toolbar"><div class="filters" role="group" aria-label="Status"><button type="button" data-status="all" aria-pressed="true">All orders</button><button type="button" data-status="pending" aria-pressed="false">To ship<span id="pendingBadge" class="filter-count" aria-hidden="true"></span></button><button type="button" data-status="shipped" aria-pressed="false">Shipped</button></div><div class="search-refresh"><label class="search-field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><span class="sr-only">Search orders</span><input id="orderSearch" type="search" aria-label="Search orders" placeholder="Search by product" autocomplete="off" enterkeyhint="search"></label><button id="refreshOrders" class="refresh-button" type="button" aria-label="Refresh orders" title="Refresh orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 6v5h-5M4 18v-5h5"/><path d="M6.1 6.1A8 8 0 0 1 20 11M4 13a8 8 0 0 0 13.9 4.9"/></svg></button></div></div>

<div class="table-wrap"><table><thead><tr><th scope="col">Order</th><th scope="col">Product</th><th scope="col">Status</th><th scope="col">Updated</th></tr></thead><tbody id="orderRows"></tbody></table></div>
