<!doctype html>
<html lang="ja" dir="ltr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>スタジオの注文 · Luma Studio</title><link rel="icon" href="../favicon/favicon.ico"><link rel="stylesheet" href="./repeat-demo.css?v=bd1c0feabf54"></head>
<body><header class="topbar"><a class="brand" href="./repeat-ja.html"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9Z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9M8 5.2l8 4.6"/></svg></span>Luma Studio</a><span class="demo-note">デモデータ</span><select id="language" aria-label="言語"><option value="en-US">English</option><option value="zh-Hans">简体中文</option><option value="zh-Hant">繁體中文</option><option value="ja" selected>日本語</option><option value="ko">한국어</option><option value="de-DE">Deutsch</option><option value="fr-FR">Français</option><option value="es-ES">Español</option><option value="pt-PT">Português</option><option value="ar-SA">العربية</option></select></header>
<main><div class="page-heading"><div><h1>スタジオの注文</h1><p>今日の発送予定を、ひと目で。</p></div></div>
<section class="metrics" aria-label="スタジオの注文"><div><span>発送待ちの注文</span><strong id="pendingCount">—</strong><i class="metric-line amber" aria-hidden="true"></i></div><div><span>本日の発送</span><strong id="shippedCount">—</strong><i class="metric-line green" aria-hidden="true"></i></div><div><span>条件に合う注文</span><strong id="matchingCount">—</strong><i class="metric-line blue" aria-hidden="true"></i></div></section>
<section id="orders" class="orders-panel" aria-label="スタジオの注文"><div class="panel-toolbar"><div class="filters" role="group" aria-label="状況"><button type="button" data-status="all" aria-pressed="true">すべての注文</button><button type="button" data-status="pending" aria-pressed="false">発送待ち<span id="pendingBadge" class="filter-count" aria-hidden="true"></span></button><button type="button" data-status="shipped" aria-pressed="false">発送済み</button></div><div class="search-refresh"><label class="search-field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><span class="sr-only">注文を検索</span><input id="orderSearch" type="search" aria-label="注文を検索" placeholder="商品名で検索" autocomplete="off" enterkeyhint="search"></label><button id="refreshOrders" class="refresh-button" type="button" aria-label="注文を更新" title="注文を更新"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 6v5h-5M4 18v-5h5"/><path d="M6.1 6.1A8 8 0 0 1 20 11M4 13a8 8 0 0 0 13.9 4.9"/></svg></button></div></div>
<div class="sync-row"><p id="syncStatus" role="status" aria-live="polite">たった今更新</p><button id="clearFilters" type="button" hidden>絞り込みを解除</button></div>
<div class="table-wrap"><table><thead><tr><th scope="col">注文</th><th scope="col">商品</th><th scope="col">状況</th><th scope="col">更新日時</th></tr></thead><tbody id="orderRows"></tbody></table></div>
<footer class="table-footer"><p id="showing" role="status" aria-live="polite"></p><div><button id="loadMore" type="button">さらに表示</button></div></footer></section></main>
<script type="application/json" id="demoCopy">{"title": "スタジオの注文", "subtitle": "今日の発送予定を、ひと目で。", "all": "すべての注文", "pending": "発送待ち", "shipped": "発送済み", "search": "注文を検索", "placeholder": "商品名で検索", "refresh": "注文を更新", "updated": "たった今更新", "newOrders": "新しい注文が{n}件届きました", "order": "注文", "product": "商品", "status": "状況", "time": "更新日時", "now": "たった今", "minutes": "{n}分前", "more": "さらに表示", "next": "次へ", "showing": "{total}件中{n}件を表示", "demo": "デモデータ", "new": "新着", "toShip": "発送待ちの注文", "today": "本日の発送", "inView": "条件に合う注文", "reset": "絞り込みを解除", "products": ["デスクライト", "トートバッグ", "マグカップ", "ヘッドホン", "ノート", "トラベルボトル"], "language": "言語", "empty": "条件に合う注文はありません。"}</script><script src="./repeat-demo.js?v=bd1c0feabf54" defer></script></body></html>
