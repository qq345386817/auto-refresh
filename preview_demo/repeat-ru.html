<body><header class="topbar"><a class="brand" href="./repeat-ru.html"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9Z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9M8 5.2l8 4.6"/></svg></span>Luma Studio</a><span class="demo-note">Данные примера</span><select id="language" aria-label="Язык"><option value="en-US">English</option><option value="zh-Hans">简体中文</option><option value="zh-Hant">繁體中文</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="de-DE">Deutsch</option><option value="fr-FR">Français</option><option value="es-ES">Español</option><option value="pt-PT">Português</option><option value="ar-SA">العربية</option><option value="hi">हिन्दी</option><option value="ru" selected>Русский</option></select></header>
<main><div class="page-heading"><div><h1>Заказы студии</h1><p>Все заказы, которые ждут отправки.</p></div></div>
<section class="metrics" aria-label="Заказы студии"><div><span>Ожидают отправки</span><strong id="pendingCount">—</strong><i class="metric-line amber" aria-hidden="true"></i></div><div><span>Отправлено сегодня</span><strong id="shippedCount">—</strong><i class="metric-line green" aria-hidden="true"></i></div><div><span>По фильтру</span><strong id="matchingCount">—</strong><i class="metric-line blue" aria-hidden="true"></i></div></section>
<section id="orders" class="orders-panel" aria-label="Заказы студии"><div class="panel-toolbar"><div class="filters" role="group" aria-label="Статус"><button type="button" data-status="all" aria-pressed="true">Все заказы</button><button type="button" data-status="pending" aria-pressed="false">К отправке<span id="pendingBadge" class="filter-count" aria-hidden="true"></span></button><button type="button" data-status="shipped" aria-pressed="false">Отправлено</button></div><div class="search-refresh"><label class="search-field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><span class="sr-only">Поиск заказов</span><input id="orderSearch" type="search" aria-label="Поиск заказов" placeholder="Поиск по товару" autocomplete="off" enterkeyhint="search"></label><button id="refreshOrders" class="refresh-button" type="button" aria-label="Обновить заказы" title="Обновить заказы"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 6v5h-5M4 18v-5h5"/><path d="M6.1 6.1A8 8 0 0 1 20 11M4 13a8 8 0 0 0 13.9 4.9"/></svg></button></div></div>
<div class="sync-row"><p id="syncStatus" role="status" aria-live="polite">Обновлено только что</p><button id="clearFilters" type="button" hidden>Сбросить фильтры</button></div>
<div class="table-wrap"><table><thead><tr><th scope="col">Заказ</th><th scope="col">Товар</th><th scope="col">Статус</th><th scope="col">Обновлено</th></tr></thead><tbody id="orderRows"></tbody></table></div>
<footer class="table-footer"><p id="showing" role="status" aria-live="polite"></p><div><button id="loadMore" type="button">Загрузить ещё</button></div></footer></section></main>
