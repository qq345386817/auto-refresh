<body><header class="topbar"><a class="brand" href="./repeat-pt-pt.html"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9Z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9M8 5.2l8 4.6"/></svg></span>Luma Studio</a><span class="demo-note">Dados de demonstração</span><select id="language" aria-label="Idioma"><option value="en-US">English</option><option value="zh-Hans">简体中文</option><option value="zh-Hant">繁體中文</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="de-DE">Deutsch</option><option value="fr-FR">Français</option><option value="es-ES">Español</option><option value="pt-PT" selected>Português</option><option value="ar-SA">العربية</option></select></header>
<main><div class="page-heading"><div><h1>Encomendas do estúdio</h1><p>Veja o que precisa de ser enviado hoje.</p></div></div>
<section class="metrics" aria-label="Encomendas do estúdio"><div><span>A aguardar envio</span><strong id="pendingCount">—</strong><i class="metric-line amber" aria-hidden="true"></i></div><div><span>Enviadas hoje</span><strong id="shippedCount">—</strong><i class="metric-line green" aria-hidden="true"></i></div><div><span>Encomendas encontradas</span><strong id="matchingCount">—</strong><i class="metric-line blue" aria-hidden="true"></i></div></section>
<section id="orders" class="orders-panel" aria-label="Encomendas do estúdio"><div class="panel-toolbar"><div class="filters" role="group" aria-label="Estado"><button type="button" data-status="all" aria-pressed="true">Todas</button><button type="button" data-status="pending" aria-pressed="false">Por enviar<span id="pendingBadge" class="filter-count" aria-hidden="true"></span></button><button type="button" data-status="shipped" aria-pressed="false">Enviadas</button></div><div class="search-refresh"><label class="search-field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><span class="sr-only">Pesquisar encomendas</span><input id="orderSearch" type="search" aria-label="Pesquisar encomendas" placeholder="Pesquisar por produto" autocomplete="off" enterkeyhint="search"></label><button id="refreshOrders" class="refresh-button" type="button" aria-label="Atualizar encomendas" title="Atualizar encomendas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 6v5h-5M4 18v-5h5"/><path d="M6.1 6.1A8 8 0 0 1 20 11M4 13a8 8 0 0 0 13.9 4.9"/></svg></button></div></div>
<div class="sync-row"><p id="syncStatus" role="status" aria-live="polite">Atualizado agora</p><button id="clearFilters" type="button" hidden>Limpar filtros</button></div>
<div class="table-wrap"><table><thead><tr><th scope="col">Encomenda</th><th scope="col">Produto</th><th scope="col">Estado</th><th scope="col">Atualização</th></tr></thead><tbody id="orderRows"></tbody></table></div>
<footer class="table-footer"><p id="showing" role="status" aria-live="polite"></p><div><button id="loadMore" type="button">Carregar mais</button></div></footer></section></main>
