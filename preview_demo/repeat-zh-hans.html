<!doctype html>
<html lang="zh-Hans" dir="ltr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>工作室订单 · Luma Studio</title><link rel="icon" href="../favicon/favicon.ico"><link rel="stylesheet" href="./repeat-demo.css?v=bd1c0feabf54"></head>
<body><header class="topbar"><a class="brand" href="./repeat-zh-hans.html"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9Z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9M8 5.2l8 4.6"/></svg></span>Luma Studio</a><span class="demo-note">演示数据</span><select id="language" aria-label="语言"><option value="en-US">English</option><option value="zh-Hans" selected>简体中文</option><option value="zh-Hant">繁體中文</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="de-DE">Deutsch</option><option value="fr-FR">Français</option><option value="es-ES">Español</option><option value="pt-PT">Português</option><option value="ar-SA">العربية</option></select></header>
<main><div class="page-heading"><div><h1>工作室订单</h1><p>看看今天有哪些订单需要发出。</p></div></div>
<section class="metrics" aria-label="工作室订单"><div><span>待发货订单</span><strong id="pendingCount">—</strong><i class="metric-line amber" aria-hidden="true"></i></div><div><span>今日已发货</span><strong id="shippedCount">—</strong><i class="metric-line green" aria-hidden="true"></i></div><div><span>符合筛选的订单</span><strong id="matchingCount">—</strong><i class="metric-line blue" aria-hidden="true"></i></div></section>
<section id="orders" class="orders-panel" aria-label="工作室订单"><div class="panel-toolbar"><div class="filters" role="group" aria-label="状态"><button type="button" data-status="all" aria-pressed="true">全部订单</button><button type="button" data-status="pending" aria-pressed="false">待发货<span id="pendingBadge" class="filter-count" aria-hidden="true"></span></button><button type="button" data-status="shipped" aria-pressed="false">已发货</button></div><div class="search-refresh"><label class="search-field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><span class="sr-only">搜索订单</span><input id="orderSearch" type="search" aria-label="搜索订单" placeholder="输入商品名称" autocomplete="off" enterkeyhint="search"></label><button id="refreshOrders" class="refresh-button" type="button" aria-label="刷新订单" title="刷新订单"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 6v5h-5M4 18v-5h5"/><path d="M6.1 6.1A8 8 0 0 1 20 11M4 13a8 8 0 0 0 13.9 4.9"/></svg></button></div></div>
<div class="sync-row"><p id="syncStatus" role="status" aria-live="polite">刚刚已更新</p><button id="clearFilters" type="button" hidden>清除筛选</button></div>
<div class="table-wrap"><table><thead><tr><th scope="col">订单</th><th scope="col">商品</th><th scope="col">状态</th><th scope="col">更新时间</th></tr></thead><tbody id="orderRows"></tbody></table></div>
<footer class="table-footer"><p id="showing" role="status" aria-live="polite"></p><div><button id="loadMore" type="button">加载更多</button></div></footer></section></main>
<script type="application/json" id="demoCopy">{"title": "工作室订单", "subtitle": "看看今天有哪些订单需要发出。", "all": "全部订单", "pending": "待发货", "shipped": "已发货", "search": "搜索订单", "placeholder": "输入商品名称", "refresh": "刷新订单", "updated": "刚刚已更新", "newOrders": "收到 {n} 笔新订单", "order": "订单", "product": "商品", "status": "状态", "time": "更新时间", "now": "刚刚", "minutes": "{n} 分钟前", "more": "加载更多", "next": "下一页", "showing": "显示 {n} / {total} 笔订单", "demo": "演示数据", "new": "新订单", "toShip": "待发货订单", "today": "今日已发货", "inView": "符合筛选的订单", "reset": "清除筛选", "products": ["台灯", "帆布包", "陶瓷杯", "耳机", "笔记本", "随行杯"], "language": "语言", "empty": "没有符合筛选条件的订单。"}</script><script src="./repeat-demo.js?v=bd1c0feabf54" defer></script></body></html>
