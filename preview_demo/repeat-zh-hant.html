<body><header class="topbar"><a class="brand" href="./repeat-zh-hant.html"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9Z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9M8 5.2l8 4.6"/></svg></span>Luma Studio</a><span class="demo-note">示範資料</span><select id="language" aria-label="語言"><option value="en-US">English</option><option value="zh-Hans">简体中文</option><option value="zh-Hant" selected>繁體中文</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="de-DE">Deutsch</option><option value="fr-FR">Français</option><option value="es-ES">Español</option><option value="pt-PT">Português</option><option value="ar-SA">العربية</option></select></header>
<main><div class="page-heading"><div><h1>工作室訂單</h1><p>看看今天有哪些訂單需要寄出。</p></div></div>
<section class="metrics" aria-label="工作室訂單"><div><span>待出貨訂單</span><strong id="pendingCount">—</strong><i class="metric-line amber" aria-hidden="true"></i></div><div><span>今日已出貨</span><strong id="shippedCount">—</strong><i class="metric-line green" aria-hidden="true"></i></div><div><span>符合篩選的訂單</span><strong id="matchingCount">—</strong><i class="metric-line blue" aria-hidden="true"></i></div></section>
<section id="orders" class="orders-panel" aria-label="工作室訂單"><div class="panel-toolbar"><div class="filters" role="group" aria-label="狀態"><button type="button" data-status="all" aria-pressed="true">全部訂單</button><button type="button" data-status="pending" aria-pressed="false">待出貨<span id="pendingBadge" class="filter-count" aria-hidden="true"></span></button><button type="button" data-status="shipped" aria-pressed="false">已出貨</button></div><div class="search-refresh"><label class="search-field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><span class="sr-only">搜尋訂單</span><input id="orderSearch" type="search" aria-label="搜尋訂單" placeholder="輸入商品名稱" autocomplete="off" enterkeyhint="search"></label><button id="refreshOrders" class="refresh-button" type="button" aria-label="重新整理訂單" title="重新整理訂單"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 6v5h-5M4 18v-5h5"/><path d="M6.1 6.1A8 8 0 0 1 20 11M4 13a8 8 0 0 0 13.9 4.9"/></svg></button></div></div>
<div class="sync-row"><p id="syncStatus" role="status" aria-live="polite">剛剛已更新</p><button id="clearFilters" type="button" hidden>清除篩選</button></div>
<div class="table-wrap"><table><thead><tr><th scope="col">訂單</th><th scope="col">商品</th><th scope="col">狀態</th><th scope="col">更新時間</th></tr></thead><tbody id="orderRows"></tbody></table></div>
<footer class="table-footer"><p id="showing" role="status" aria-live="polite"></p><div><button id="loadMore" type="button">載入更多</button></div></footer></section></main>
<script type="application/json" id="demoCopy">{"title": "工作室訂單", "subtitle": "看看今天有哪些訂單需要寄出。", "all": "全部訂單", "pending": "待出貨", "shipped": "已出貨", "search": "搜尋訂單", "placeholder": "輸入商品名稱", "refresh": "重新整理訂單", "updated": "剛剛已更新", "newOrders": "收到 {n} 筆新訂單", "order": "訂單", "product": "商品", "status": "狀態", "time": "更新時間", "now": "剛剛", "minutes": "{n} 分鐘前", "more": "載入更多", "next": "下一頁", "showing": "顯示 {n} / {total} 筆訂單", "demo": "示範資料", "new": "新訂單", "toShip": "待出貨訂單", "today": "今日已出貨", "inView": "符合篩選的訂單", "reset": "清除篩選", "products": ["檯燈", "帆布袋", "陶瓷杯", "耳機", "筆記本", "隨行杯"], "language": "語言", "empty": "沒有符合篩選條件的訂單。"}</script><script src="./repeat-demo.js?v=bd1c0feabf54" defer></script></body></html>
